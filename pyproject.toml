[project]
name = "edge-research"
version = "0.1.0"
description = "Autonomous forex strategy research loop: Fable/Opus/Sonnet decide, a Python engine computes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<3",
    "polars>=1.0",
    "pyarrow>=16",
    "numba>=0.60",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "anthropic>=1.0",
    "typer>=0.12",
    "rich>=13",
    "tqdm>=4.66",
    "httpx>=0.27",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
