# Ideas already tested and rejected before this programme started (seed for the scrap index).
# Sources: github.com/techlvling/gj-strat results/alpha_hunt/REPORT.md + CHARTER.md (2026-10-11),
#          github.com/helldock0/trade-research docs/STATUS.md (2026-07).
# The Director must not re-test these unless the new idea is clearly different in mechanism.

- slug: prior_index_meanrev
  family: mean_reversion_index
  title: Index dip-buying (44 variants, Nasdaq/S&P/Nikkei)
  lesson: Only RSI(2)<5 above SMA200 on Nasdaq (MR6) survived two of three adversarial checks; weak, 4-5 trades/yr, flat 2018-23, knife-edge threshold. MR4 (buy after big down day, hold 5d) refuted - it was index drift. Random longs on a rising index pass the bar 2-8% of the time.
- slug: prior_fomc_cycle
  family: event_fed
  title: Pre- and post-FOMC drift on Nasdaq and USD pairs (9 variants)
  lesson: Pre-meeting drift exists before costs but only since 2016; 2010-15 lost. Not tradeable after costs.
- slug: prior_trend_follow
  family: trend_following
  title: Donchian / trend-gated breakouts on 13 markets, D1 and H4
  lesson: FX trend is flat to negative even before costs; index and gold breakouts made money only from the bull market.
- slug: prior_fx_carry
  family: carry
  title: G8 FX carry with trend and low-vol filters (9 variants)
  lesson: Carry earned its swap then gave it back in crash months (2015-08, 2020-03, 2024-08).
- slug: prior_fx_rates
  family: macro_rates
  title: 2-year yield gap fair-value and momentum (10 variants)
  lesson: Yield momentum copies price momentum; fair-value fade only worked after 2018.
- slug: prior_index_flows
  family: calendar_flow_index
  title: Option expiry, pension rebalancing, turn-of-month on indices (8 variants)
  lesson: Turn-of-month long when stocks beat bonds is the best near miss (design t 1.49); S&P barely confirms.
- slug: prior_cross_zfade
  family: mean_reversion_fx
  title: Z-score fades on range-bound FX crosses (9 variants)
  lesson: 2-sigma moves kept running; stop hit on 43-58% of trades.
- slug: prior_fx_session_rev
  family: intraday_reversal
  title: Asia-session extreme reversal into London/NY (8 variants)
  lesson: No reversal and no momentum before costs; costs make every variant lose.
- slug: prior_cb_drift
  family: event_central_bank
  title: Follow or fade the decision-day move at 7 central banks (10 variants)
  lesson: No drift after the decision day; follow and fade are mirror images of zero.
- slug: prior_index_vol_timing
  family: vol_timing
  title: VRP / realised-vol scaled index exposure (18 variants)
  lesson: Cuts the worst day and drawdown but never beats buy-and-hold; safety, not edge.
- slug: prior_fx_value_mom
  family: value_momentum
  title: G8 FX value + momentum + carry combinations (8 variants)
  lesson: Value lost on the yen 2024-26; momentum lost at every horizon.
- slug: prior_ust_auction
  family: event_treasury
  title: USDJPY around month-end Treasury auctions (8 variants)
  lesson: The gain is the month-end USD effect (M-3), not an auction effect.
- slug: prior_eq_overnight_drift
  family: overnight_drift
  title: Index overnight drift at the European open (14 variants)
  lesson: Real before costs (about 0.9 bp per trade) but costs are about 3.3 bp.
- slug: prior_cot_positioning
  family: positioning
  title: CFTC positioning fades and follows, 8 markets
  lesson: Fading crowds is flat in design; other variants lose after weekly costs.
- slug: prior_box_breakouts
  family: session_breakout
  title: Time-box breakouts at many clock times on 31 markets (London, Asian range, prev-day, inside bar, NR7, NY ORB, Frankfurt)
  lesson: Only the 05:00 IST USDJPY box works, best with a vol filter; everything else dies on 1-1.5 pip costs plus spread. Fade of the failed break (Version C) works only on USDJPY (+0.14R).
- slug: prior_fix_fades
  family: fix_flow
  title: London 4pm fix fade/follow, ECB fix, NY cut, gold fix, CNY fix, Tokyo fix month-start
  lesson: Only the Tokyo fix on gotobi days (USDJPY) and the EURGBP month-end fix survived; the rest did not.
- slug: prior_flow_atlas
  family: clock_calendar_scan
  title: 600,912 clock x calendar x currency-strength mean tests
  lesson: Three tradeable slots only - EURGBP month-end fix, USDJPY after US holiday, USD bid 11:00-12:00 UTC on the 3rd-last weekday (M-3). Any new clock/calendar idea must beat this scan's Bonferroni bar (design t >= 3.7).
- slug: prior_round_numbers
  family: price_level
  title: Round-number fade and breakout
  lesson: Nothing after costs.
- slug: prior_nasdaq_lead_lag
  family: cross_asset_leadlag
  title: Nikkei / Nasdaq lead-lag vs USDJPY, gap fills, NFP, Monday gap
  lesson: Nothing after costs. Nasdaq turn-of-month weakly positive everywhere but below the bar.
- slug: prior_recent_winners
  family: meta_rotation
  title: Walk-forward "recent winners" rotation over ~500 signal streams; logistic filter on the box
  lesson: Fails out of sample; selection noise dominates.
- slug: prior_tokyo_fix_long
  family: fix_flow
  title: Long into the 09:55 JST Tokyo fix (patterns_usdjpy P1), all day types
  lesson: Cost-dominated on every day type - gotobi about 0 R, other weekdays -0.07 to -0.09 R in design and negative in check. Only the post-fix SHORT on gotobi days (sell 00:55 UTC, exit 06:00 UTC) pays; pre-fix longs, non-gotobi post-fix shorts and Tokyo-open variants are measured and dead.
- slug: prior_gotobi_holiday_calendar
  family: fix_flow
  title: Gotobi dates shifted off Japanese public holidays (gotobi_calendar)
  lesson: Holiday-adjusted calendar measured at design +0.143 R vs +0.144 R for the simple weekend rule - no gain, not adopted. Day-before-Japan-holiday and England bank holiday day types are in the flow atlas.
- slug: prior_nasdaq_intraday_momentum
  family: intraday_momentum_index
  title: Nasdaq intraday momentum (first half hour predicts last half hour, Gao et al.) and pre-holiday drift (index_anomalies E3/E4)
  lesson: E4a/E4b intraday momentum -0.12 R in design after 1 point slippage per fill; E3 pre-holiday weakly positive, below the bar. Index CFD intraday trades cost 7-14 bp round trip in 2012-2014; intraday index ideas are cost-dead in the design years.
- slug: prior_monthend_hedge
  family: calendar_flow
  title: Melvin-Prins equity-hedge rebalancing flow at month-end on USDJPY (monthend_hedge)
  lesson: Design t 2.5 to 4.0 but negative in check - month-end fix flows faded after 2018 in every form tested; only the 11:00 UTC 3rd-last-weekday USD bid (M-3) survived.
- slug: prior_trade_research_2026_07
  family: htf_pullback_and_session
  title: trade-research repo - 11 strategies (session CS momentum, ORB, D1 momentum, H4/M15 EMA pullbacks with/without ADX, London fail fade, MSNR zones, VWAP fade, H1 Donchian+ATR, XAUUSD HTF pullback)
  lesson: All NO-GO after FTMO-style costs, expectancy -0.03 to -0.13 R. Do not stack filters on rejected HTF pullback lines.
